edge:
  # Top-level orchestrator settings
  environment: dev
  log_level: debug
  log_format: text
  config_file: ./config/config.dev.yaml

  # Event bus configuration
  event_bus:
    provider: metastorage
    buffer_size: 100
    max_retries: 3
    initial_backoff: 1s
    max_backoff: 60s
    backoff_multiplier: 2.0
    retry_interval: 10s
    ordering_mode: best_effort  # Event ordering: "none", "best_effort", "strict"
    ordering_buffer_size: 100   # Buffer size for out-of-order events
    ordering_timeout: 30s        # Timeout for waiting for missing sequences in strict mode

  # AI Gateway configuration
  ai:
    aiserviceurl: "http://localhost:8080"
    inferenceinterval: 1s
    confidencethreshold: 0.5
    enabledclasses: []
    requesttimeout: 30s
    maxretries: 3
    retrydelay: 1s

  # CCTV service configuration (cameras)
  cctv:
    discovery:
      enabled: true
      interval: 60s
      usb_device_path: /dev
    rtsp:
      timeout: 30s
      reconnect_interval: 5s

  # Metadata storage configuration (for screenshots, clips metadata, etc.)
  meta_storage:
    provider: bbolt
    endpoint: ""
    access_key: ""
    secret_key: ""
    region: ""
    data_dir: ../../infra/dev/data/db

  # Object storage configuration (for clips, snapshots files)
  object_storage:
    provider: minio
    endpoint: "localhost:9010"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    region: "us-east-1"

  # VM Gateway configuration (for communication with VM)
  vm_gateway:
    provider: http
    edge_id: edge-dev-001
    wireguard:
      enabled: false
      config_path: ""
      kvm_endpoint: "localhost:51820"
      interface_name: wg0
      health_check_interval: 10s
      connection_timeout: 30s
      ping_timeout: 2s
      reconnect_timeout: 5s
      max_reconnect_attempts: 10
    https_server_config:
      listen_address: "localhost:8443"
      server_cert_path: "/home/vova/My-Projects/view-guard-meta/infra/dev/ssl/edge-server.crt"
      server_key_path: "/home/vova/My-Projects/view-guard-meta/infra/dev/ssl/edge-server.key"
      ca_cert_path: "/home/vova/My-Projects/view-guard-meta/infra/dev/ssl/ca.crt"
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 120s
      wireguard_interface_wait_timeout: 60s
      wireguard_interface_check_interval: 2s
      multipart_form_max_memory: 10485760  # 10MB
    https_client_config:
      vm_endpoint: "localhost:8444"
      client_cert_path: "/home/vova/My-Projects/view-guard-meta/infra/dev/ssl/edge-client.crt"
      client_key_path: "/home/vova/My-Projects/view-guard-meta/infra/dev/ssl/edge-client.key"
      ca_cert_path: "/home/vova/My-Projects/view-guard-meta/infra/dev/ssl/ca.crt"
      timeout: 30s

  # Web Gateway configuration (local admin UI)
  web_gateway:
    enabled: true
    host: "localhost"
    port: 3000

  # Telemetry configuration (OpenTelemetry)
  telemetry:
    servicename: "edge-orchestrator"
    environment: "dev"
    mode: "edge"
    otlpendpoint: "http://localhost:4318"
    insecure: true
    timeout: 10s
    resourceattributes: {}
