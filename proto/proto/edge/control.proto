syntax = "proto3";

package edge.control;

option go_package = "github.com/vzahanych/view-guard-meta/proto/go/generated/edge";

// ControlService handles control commands from KVM VM to Edge
service ControlService {
  // GetConfig retrieves current Edge configuration
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  
  // UpdateConfig updates Edge configuration
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  
  // RestartService restarts a specific service
  rpc RestartService(RestartServiceRequest) returns (RestartServiceResponse);

  // SyncCapabilities allows an Edge to report camera and dataset readiness
  rpc SyncCapabilities(SyncCapabilitiesRequest) returns (SyncCapabilitiesResponse);
  
  // RequestSnapshotCapture requests Edge to capture labeled snapshots from a camera
  rpc RequestSnapshotCapture(RequestSnapshotCaptureRequest) returns (RequestSnapshotCaptureResponse);
  
  // DeployModel deploys a trained model to Edge (server-side streaming: VM streams model to Edge)
  rpc DeployModel(stream DeployModelChunk) returns (DeployModelResponse);
}

// GetConfigRequest requests current configuration
message GetConfigRequest {
  // Empty for now, can be extended with filter options
}

// GetConfigResponse contains current configuration
message GetConfigResponse {
  bool success = 1;
  string config_json = 2; // JSON-encoded configuration
  string error_message = 3;
}

// UpdateConfigRequest contains configuration updates
message UpdateConfigRequest {
  string config_json = 1; // JSON-encoded configuration updates
}

// UpdateConfigResponse contains update result
message UpdateConfigResponse {
  bool success = 1;
  string error_message = 2;
}

// RestartServiceRequest requests service restart
message RestartServiceRequest {
  string service_name = 1; // Service name to restart
}

// RestartServiceResponse contains restart result
message RestartServiceResponse {
  bool success = 1;
  string error_message = 2;
}

// SyncCapabilitiesRequest contains camera/dataset readiness information
message SyncCapabilitiesRequest {
  repeated CameraCapability cameras = 1;
  int64 synced_at = 2; // Unix nano timestamp when snapshot was taken
}

// CameraCapability describes a single camera's dataset readiness state
message CameraCapability {
  string camera_id = 1;
  string name = 2;
  string type = 3;
  bool enabled = 4;
  string status = 5;
  uint32 labeled_snapshot_count = 6;
  uint32 required_snapshot_count = 7;
  bool snapshot_required = 8;
  map<string, uint32> label_counts = 9;
}

// SyncCapabilitiesResponse contains the result of syncing capabilities
message SyncCapabilitiesResponse {
  bool success = 1;
  string error_message = 2;
}

// RequestSnapshotCaptureRequest requests Edge to capture labeled snapshots
message RequestSnapshotCaptureRequest {
  string camera_id = 1;           // Camera to capture from (required)
  string label = 2;                // Label to apply: "normal", "threat", "abnormal", "custom" (optional, default: "normal")
  string custom_label = 3;         // Required if label == "custom"
  int32 count = 4;                 // Number of snapshots to capture (optional, default: 1)
  bool auto_capture = 5;           // If true, Edge auto-captures without user interaction (for integration tests)
}

// RequestSnapshotCaptureResponse contains the result of snapshot capture request
message RequestSnapshotCaptureResponse {
  bool accepted = 1;               // Whether request was accepted
  string message = 2;              // Status message
  repeated string snapshot_ids = 3; // If auto_capture=true, returns captured snapshot IDs
}

// DeployModelChunk contains a chunk of model data or metadata (server-side streaming: VM → Edge)
message DeployModelChunk {
  oneof payload {
    DeployModelHeader header = 1; // First chunk: header with metadata
    bytes data = 2; // Subsequent chunks: model file data
  }
  int64 offset = 3; // Byte offset in the model file
  bool eof = 4; // End of file flag
  string error_message = 5; // Error message if transfer failed
}

// DeployModelHeader contains metadata for the model deployment
message DeployModelHeader {
  string deployment_id = 1; // Deployment ID for tracking
  string model_id = 2; // Model ID
  string version = 3; // Model version
  string model_type = 4; // Model type (yolo, cae, etc.)
  string camera_id = 5; // Target camera ID (required for camera-specific deployment)
  string framework = 6; // Framework (onnx, openvino, etc.)
  string training_dataset_id = 7; // Training dataset ID (if trained model)
  string training_date = 8; // Training date
  repeated int32 input_shape = 9; // Input shape (e.g., [1, 3, 640, 640])
  map<string, string> preprocessing = 10; // Preprocessing configuration (JSON-encoded values)
  string metadata_json = 11; // Full metadata JSON for Edge reference
  uint64 total_size = 12; // Total size of the model file in bytes
}

// DeployModelResponse contains the result of model deployment
message DeployModelResponse {
  bool success = 1;
  string model_file_path = 2; // Path to deployed model file on Edge
  string message = 3; // Status message
  string error_message = 4; // Error message if deployment failed
}

